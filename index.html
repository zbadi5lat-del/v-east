    <meta name="theme-color" content="#0B2936" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('veast-theme');
          const theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          const savedLanguage = localStorage.getItem('veast-language');
          const language = savedLanguage === 'en' || savedLanguage === 'ar' ? savedLanguage : 'ar';
          const root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.language = language;
          root.lang = language;
          root.dir = language === 'ar' ? 'rtl' : 'ltr';
        } catch {}
      })();
    </script>

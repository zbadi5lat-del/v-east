name: V.East live production verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".qa/LIVE_PROBE"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative main harness
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Source and production build regression gates
        run: |
          npm run verify:source
          npm run verify:worldclass
          npm run verify:final-experience
          npm run lint
          npm run build

      - name: Resolve verified production URL
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "https://v-east-support-lint.vercel.app"
            "https://v-east.vercel.app"
            "https://v-east-git-main-support-lint.vercel.app"
          )
          : > /tmp/probe-summary.txt
          found=""
          for url in "${candidates[@]}"; do
            safe=$(echo "$url" | tr -cd '[:alnum:]')
            body="/tmp/body-${safe}.html"
            meta=$(curl -L --silent --show-error --max-time 20               -o "$body" -w '%{http_code}|%{url_effective}|%{content_type}' "$url" || true)
            echo "$url => $meta" | tee -a /tmp/probe-summary.txt
            code="${meta%%|*}"
            if [[ "$code" =~ ^2[0-9][0-9]$ ]] && grep -Eiq 'V[.]?EAST|Sports[[:space:]]*&[[:space:]]*Tourism|إدارة وتشغيل' "$body"; then
              effective=$(echo "$meta" | cut -d'|' -f2)
              found="$effective"
              break
            fi
          done
          cat /tmp/probe-summary.txt
          if [[ -z "$found" ]]; then
            echo "::error::No public production alias returned the V.East application."
            exit 1
          fi
          printf '%s\n' "$found" > /tmp/live-url.txt
          echo "LIVE_URL=$found" >> "$GITHUB_ENV"
          echo "Verified live URL: $found"

      - name: Install browser driver only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-e2e
          cd /tmp/live-e2e
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.55.0
          command -v google-chrome || command -v chromium || command -v chromium-browser

      - name: Verify production security headers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --silent --show-error --max-time 20 -D /tmp/live-security-headers.txt -o /dev/null "$LIVE_URL"
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('/tmp/live-security-headers.txt').read_text(encoding='utf-8',errors='replace')
          blocks=[block for block in raw.replace('\r\n','\n').split('\n\n') if block.strip()]
          final=blocks[-1].splitlines() if blocks else []
          headers={}
          for line in final[1:]:
              if ':' not in line: continue
              key,value=line.split(':',1)
              headers[key.strip().lower()]=value.strip()
          required={
              'x-content-type-options':'nosniff',
              'referrer-policy':'strict-origin-when-cross-origin',
              'x-frame-options':'DENY',
              'permissions-policy':'camera=(), microphone=(), geolocation=(), payment=(), usb=()',
              'x-permitted-cross-domain-policies':'none',
          }
          failures=[]
          for key,value in required.items():
              actual=headers.get(key,'')
              if actual.lower()!=value.lower():
                  failures.append(f'{key}: expected={value!r} actual={actual!r}')
          csp=headers.get('content-security-policy','')
          for token in ("frame-ancestors 'none'","base-uri 'self'","object-src 'none'"):
              if token not in csp:
                  failures.append(f'content-security-policy missing {token!r}: {csp!r}')
          if failures:
              raise SystemExit('Live security headers failed: '+ ' | '.join(failures))
          print('PASS live production security headers')
          PY

      - name: Verify live bundle exactly matches current main build
        shell: bash
        run: |
          set -euo pipefail
          live_html=/tmp/live-fingerprint.html
          curl -L --silent --show-error --max-time 20 "$LIVE_URL" -o "$live_html"
          local_assets=$(grep -oE '/assets/[^"[:space:]]+\.(js|css)' dist/index.html | sort -u)
          live_assets=$(grep -oE '/assets/[^"[:space:]]+\.(js|css)' "$live_html" | sort -u)
          {
            echo "CURRENT_MAIN=$(git rev-parse HEAD)"
            echo "LOCAL_ASSETS"
            printf '%s\n' "$local_assets"
            echo "LIVE_ASSETS"
            printf '%s\n' "$live_assets"
          } | tee /tmp/live-fingerprint.txt
          if [ "$local_assets" != "$live_assets" ]; then
            echo "::error::Live asset names do not match authoritative current main build"
            exit 2
          fi
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            local_file="dist$rel"
            live_file="/tmp/live-asset-$(basename "$rel")"
            test -f "$local_file"
            curl -L --silent --show-error --max-time 20 "$LIVE_URL$rel" -o "$live_file"
            local_sha=$(sha256sum "$local_file" | awk '{print $1}')
            live_sha=$(sha256sum "$live_file" | awk '{print $1}')
            printf '%s local=%s live=%s\n' "$rel" "$local_sha" "$live_sha" | tee -a /tmp/live-fingerprint.txt
            if [ "$local_sha" != "$live_sha" ]; then
              echo "::error::Live asset bytes differ from authoritative current main build: $rel"
              exit 3
            fi
          done <<< "$local_assets"
          echo "PASS exact live bundle fingerprint" | tee -a /tmp/live-fingerprint.txt

      - name: Live historical bug-class regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --no-save --package-lock=false playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          PREVIEW_URL="$LIVE_URL" CHROME_PATH="$CHROME_PATH" timeout --signal=TERM --kill-after=10s 240s node scripts/historical-regression-matrix.mjs

      - name: Live browser E2E
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/live-e2e/check.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs/promises';

          const url = process.env.LIVE_URL;
          const chrome = process.env.CHROME_PATH || '/usr/bin/google-chrome';
          const results = { url, checks: [], consoleErrors: [], motionCadence: {} };
          const pass = (name, detail='') => { results.checks.push({name, pass:true, detail}); console.log('PASS', name, detail); };
          const fail = (name, detail='') => { results.checks.push({name, pass:false, detail}); throw new Error(name + (detail ? ': ' + detail : '')); };
          const assert = (cond, name, detail='') => cond ? pass(name, detail) : fail(name, detail);
          const cadence = async (page, duration=1000, scroll=false) => page.evaluate(async ({duration,scroll}) => {
            const samples=[];
            let start=performance.now(), last=start;
            return await new Promise(resolve=>{
              const tick=now=>{
                samples.push(now-last); last=now;
                const elapsed=now-start;
                if(scroll) scrollTo(0, Math.min(900, (elapsed/duration)*900));
                if(elapsed<duration) requestAnimationFrame(tick);
                else {
                  const clean=samples.slice(2).sort((a,b)=>a-b);
                  const pick=q=>clean[Math.min(clean.length-1,Math.floor((clean.length-1)*q))]||0;
                  const avg=clean.reduce((a,b)=>a+b,0)/Math.max(clean.length,1);
                  const slow=clean.filter(x=>x>34).length;
                  resolve({frames:clean.length,avg:+avg.toFixed(2),median:+pick(.5).toFixed(2),p95:+pick(.95).toFixed(2),slow34:slow,slowRatio:+(slow/Math.max(clean.length,1)).toFixed(3)});
                }
              };
              requestAnimationFrame(tick);
            });
          },{duration,scroll});

          const browser = await chromium.launch({headless:true, executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage']});
          try {
            const context = await browser.newContext({viewport:{width:1440,height:1000}});
            const page = await context.newPage();
            page.on('console', msg => { if(msg.type()==='error') results.consoleErrors.push(msg.text()); });
            page.on('pageerror', err => results.consoleErrors.push('PAGEERROR: '+err.message));

            const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            assert(resp && resp.ok(),'desktop document HTTP 2xx',String(resp?.status()));
            const introCadence=await cadence(page,1100,false);
            results.motionCadence.intro=introCadence;
            assert(introCadence.frames>=20 && introCadence.median<=35.5 && introCadence.p95<=Math.max(55,introCadence.median*1.8) && introCadence.slowRatio<=0.35,'intro frame cadence stays smooth',JSON.stringify(introCadence));
            await page.waitForLoadState('networkidle',{timeout:30000}).catch(()=>{});
            await page.waitForTimeout(2300);
            const scrollCadence=await cadence(page,900,true);
            results.motionCadence.scroll=scrollCadence;
            assert(scrollCadence.frames>=17 && scrollCadence.median<=35.5 && scrollCadence.p95<=Math.max(55,scrollCadence.median*1.8) && scrollCadence.slowRatio<=0.35,'scroll motion frame cadence stays smooth',JSON.stringify(scrollCadence));
            await page.evaluate(()=>scrollTo(0,0));
            await page.waitForTimeout(100);
            assert((await page.locator('body').innerText()).includes('V.EAST'),'brand renders');
            assert(await page.locator('h1').count()===1,'exactly one H1');
            assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+2),'desktop no horizontal overflow');
            await page.screenshot({path:'/tmp/live-e2e/desktop.png',fullPage:false});

            const initialTheme=await page.evaluate(()=>document.documentElement.dataset.theme||'');
            await page.locator('[role="switch"]:visible').first().click();
            await page.waitForTimeout(250);
            const changedTheme=await page.evaluate(()=>document.documentElement.dataset.theme||'');
            assert(initialTheme!==changedTheme,'theme toggle changes real root theme',initialTheme+' -> '+changedTheme);

            const enButtons=page.locator('button').filter({hasText:/^EN$/});
            let enClicked=false;
            for(let i=0;i<await enButtons.count();i++){
              const b=enButtons.nth(i);
              if(await b.isVisible()){await b.click();enClicked=true;break;}
            }
            assert(enClicked,'visible EN language control found');
            await page.waitForTimeout(250);
            assert(await page.evaluate(()=>document.documentElement.lang==='en'&&document.documentElement.dir==='ltr'),'English sets lang=en and dir=ltr');

            await page.evaluate(()=>scrollTo(0,900));
            await page.waitForTimeout(350);
            assert(await page.locator('.site-header').evaluate(el=>el.classList.contains('is-hidden')||el.classList.contains('is-going-down')),'header reacts to downward scroll');
            await page.evaluate(()=>scrollTo(0,250));
            await page.waitForTimeout(350);
            assert(await page.locator('.site-header').evaluate(el=>!el.classList.contains('is-hidden')&&el.classList.contains('is-going-up')),'header restores on upward scroll');

            await page.locator('#places').scrollIntoViewIfNeeded();
            await page.waitForTimeout(250);
            const triggers=page.locator('[aria-haspopup="dialog"]');
            assert(await triggers.count()>=2,'featured-place dialog triggers present',String(await triggers.count()));
            await triggers.nth(0).click();
            assert(await page.locator('[role="dialog"]').count()>=1,'featured-place dialog opens');
            await page.keyboard.press('Escape');
            await page.waitForTimeout(150);
            assert(await page.locator('#place-profile-dialog').evaluate(el=>Boolean(el.closest('[aria-hidden="true"]'))),'featured-place dialog closes with Escape');

            await page.evaluate(()=>scrollTo(0,Math.min(document.body.scrollHeight*0.62,document.body.scrollHeight-1200)));
            await page.waitForTimeout(350);
            const pdfToggle=page.locator('button[aria-controls="floating-pdf-panel"]');
            if(await pdfToggle.count() && await pdfToggle.isVisible()) await pdfToggle.click();
            await page.waitForTimeout(150);
            const pdfLinks=page.locator('a[href$=".pdf"]');
            assert(await pdfLinks.count()===3,'three real PDF download links',String(await pdfLinks.count()));
            for(let i=0;i<3;i++){
              const href=await pdfLinks.nth(i).getAttribute('href');
              const absolute=new URL(href,url).href;
              const r=await context.request.get(absolute,{timeout:20000});
              const buf=await r.body();
              assert(r.ok(),`PDF ${i+1} HTTP 2xx`,String(r.status()));
              assert(buf.subarray(0,5).toString()==='%PDF-',`PDF ${i+1} has PDF header`,String(buf.length));
            }
            assert(!(await page.locator('body').innerText()).toLowerCase().includes('save this page as pdf'),'Save-as-PDF UI removed');

            await page.locator('#contact-section').scrollIntoViewIfNeeded();
            await page.waitForTimeout(450);
            const floatingState=await page.evaluate(()=>{
              const a=document.querySelector('.floating-resources');
              const w=document.querySelector('.floating-contact:not(.floating-contact--resources)');
              const s=el=>el?{opacity:getComputedStyle(el).opacity,pointer:getComputedStyle(el).pointerEvents}:null;
              return {resources:s(a),whatsapp:s(w)};
            });
            assert(floatingState.resources&&(floatingState.resources.pointer==='none'||Number(floatingState.resources.opacity)<0.1),'PDF control does not cover contact section',JSON.stringify(floatingState.resources));
            assert(floatingState.whatsapp&&(floatingState.whatsapp.pointer==='none'||Number(floatingState.whatsapp.opacity)<0.1),'WhatsApp does not cover contact section',JSON.stringify(floatingState.whatsapp));
            await page.screenshot({path:'/tmp/live-e2e/contact.png',fullPage:false});

            const hrefs=await page.locator('a[href^="#"]').evaluateAll(as=>[...new Set(as.map(a=>a.getAttribute('href')).filter(Boolean))]);
            const bad=[];
            for(const href of hrefs){
              if(href==='#') continue;
              const ok=await page.evaluate(h=>!!document.getElementById(h.slice(1)),href);
              if(!ok) bad.push(href);
            }
            assert(bad.length===0,'all internal anchors resolve',bad.join(','));

            const mobile=await browser.newContext({viewport:{width:390,height:844}});
            const mp=await mobile.newPage();
            mp.on('console',msg=>{if(msg.type()==='error')results.consoleErrors.push('MOBILE: '+msg.text());});
            mp.on('pageerror',err=>results.consoleErrors.push('MOBILE PAGEERROR: '+err.message));
            await mp.goto(url,{waitUntil:'networkidle',timeout:30000});
            await mp.waitForTimeout(3800);
            assert(await mp.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+2),'mobile no horizontal overflow');
            await mp.locator('#mobile-navigation-toggle').click();
            await mp.waitForTimeout(100);
            assert(await mp.locator('#mobile-navigation').getAttribute('aria-hidden')==='false','mobile drawer opens');
            await mp.keyboard.press('Escape');
            await mp.waitForTimeout(100);
            assert(await mp.locator('#mobile-navigation').getAttribute('aria-hidden')==='true','mobile drawer closes with Escape');
            await mp.screenshot({path:'/tmp/live-e2e/mobile.png',fullPage:false});
            await mobile.close();

            const reduced=await browser.newContext({viewport:{width:1440,height:900},reducedMotion:'reduce'});
            const rp=await reduced.newPage();
            await rp.goto(url,{waitUntil:'networkidle',timeout:30000});
            await rp.waitForTimeout(400);
            await rp.evaluate(()=>scrollTo(0,700));
            await rp.waitForTimeout(100);
            const transform=await rp.locator('.hero-copy-scroll').evaluate(el=>getComputedStyle(el).transform);
            assert(transform==='none'||transform==='matrix(1, 0, 0, 1, 0, 0)','reduced-motion suppresses hero parallax',transform);
            await reduced.close();

            assert(results.consoleErrors.length===0,'no browser console/page errors',results.consoleErrors.join(' | '));
            await context.close();
          } finally {
            await browser.close();
            await fs.writeFile('/tmp/live-e2e/results.json',JSON.stringify(results,null,2));
          }
          NODE
          cd /tmp/live-e2e
          timeout --signal=TERM --kill-after=10s 120s node check.mjs

      - name: Responsive motion matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/responsive-motion
          node --check scripts/responsive-motion-matrix.mjs
          timeout --signal=TERM --kill-after=10s 180s node scripts/responsive-motion-matrix.mjs

      - name: Full legacy-equivalent production matrices
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/live-production-matrix.mjs
          timeout --signal=TERM --kill-after=10s 240s node scripts/live-production-matrix.mjs

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veast-live-evidence
          path: |
            /tmp/live-url.txt
            /tmp/probe-summary.txt
            /tmp/live-security-headers.txt
            /tmp/live-fingerprint.txt
            /tmp/live-e2e/results.json
            /tmp/live-e2e/desktop.png
            /tmp/live-e2e/contact.png
            /tmp/live-e2e/mobile.png
            /tmp/live-matrix/results.json
            /tmp/responsive-motion/results.json
            /tmp/responsive-motion/*.png
          if-no-files-found: warn

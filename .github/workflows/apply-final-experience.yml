name: Apply verified V.East final experience

on:
  push:
    branches: [main]
    paths:
      - ".source/APPLY_FINAL_PATCH"
  pull_request:
    branches: [main]
    paths:
      - ".source/APPLY_FINAL_PATCH"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative main state
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify bounded patch transport
        shell: bash
        run: |
          set -euo pipefail

          test "$(wc -c < .source/final-text-patch.xz.b64.r00)" -eq 17500
          test "$(wc -c < .source/final-text-patch.xz.b64.r01a)" -eq 17500
          test "$(wc -c < .source/final-text-patch.xz.b64.r02)" -eq 17496

          echo "62d8b8996a12e3b611f0fa57f3dd3e73f2d038befc8d85cbfa5a60ee2c4d0b51  .source/final-text-patch.xz.b64.r00" | sha256sum -c -
          echo "8166ffe25f33adeb96d81c0e68468ed2f8e203525171263678bb35a8aab941c0  .source/final-text-patch.xz.b64.r01a" | sha256sum -c -
          echo "7bcd9a7dbf91f917613d2c6ae4a0712b679fb3639ca293b65f5bf586dcfbb807  .source/final-text-patch.xz.b64.r02" | sha256sum -c -

          cat .source/final-text-patch.xz.b64.r00               .source/final-text-patch.xz.b64.r01a               .source/final-text-patch.xz.b64.r02               > /tmp/veast-final-text-patch.xz.b64

          test "$(wc -c < /tmp/veast-final-text-patch.xz.b64)" -eq 52496
          base64 -d /tmp/veast-final-text-patch.xz.b64 > /tmp/veast-final-text-patch.tar.xz
          echo "f784b89e9f65d524c423ff6b4fab9746b0311574075916c02abed7ea224bb732  /tmp/veast-final-text-patch.tar.xz" | sha256sum -c -
          xz -t /tmp/veast-final-text-patch.tar.xz

          python - <<'PY'
          import tarfile

          allowed = {
            '.github/workflows/quality.yml',
            'package.json',
            'scripts/audit-worldclass.mjs',
            'scripts/verify-final-experience.mjs',
            'scripts/generate-pdfs.py',
            'src/App.tsx',
            'src/content.ts',
            'src/i18n.ts',
            'src/index.css',
            'src/components/FloatingWhatsApp.tsx',
            'src/components/Header.tsx',
            'src/components/Hero.tsx',
            'src/components/SiteEntrance.tsx',
          }

          with tarfile.open('/tmp/veast-final-text-patch.tar.xz', 'r:xz') as tf:
              members = [m for m in tf.getmembers() if m.isfile()]
              actual = {m.name.removeprefix('./') for m in members}
              if actual != allowed:
                  raise SystemExit(f'Unexpected patch paths: {sorted(actual ^ allowed)}')
              for m in members:
                  name = m.name.removeprefix('./')
                  if m.issym() or m.islnk() or name.startswith('/') or '..' in name.split('/'):
                      raise SystemExit(f'Unsafe archive member: {m.name}')
              tf.extractall('.', filter='data')
          PY

      - name: Generate real PDF library
        run: |
          python -m pip install --disable-pip-version-check weasyprint==68.0
          python scripts/generate-pdfs.py

      - name: PDF preflight
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path("public/downloads/V-EAST-Company-Profile.pdf"),
              Path("public/downloads/V-EAST-Services-Operations.pdf"),
              Path("public/downloads/V-EAST-Portfolio-Featured-Venues.pdf"),
          ]

          for path in files:
              data = path.read_bytes()
              if len(data) < 50_000:
                  raise SystemExit(f"{path}: unexpectedly small ({len(data)} bytes)")
              if not data.startswith(b"%PDF-"):
                  raise SystemExit(f"{path}: missing PDF header")
              if b"%%EOF" not in data[-2048:]:
                  raise SystemExit(f"{path}: missing PDF EOF marker")
              print(f"PDF PASS {path} {len(data)} bytes")
          PY

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Verify source
        run: npm run verify:source

      - name: Run world-class audit
        run: npm run verify:worldclass

      - name: Verify final motion and PDF experience
        run: npm run verify:final-experience

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Build artifact sanity
        run: test -f dist/index.html && test -d dist/assets

      - name: Commit only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree --staged -- .github/workflows || true
          if ! git ls-files --error-unmatch .github/workflows/quality.yml >/dev/null 2>&1; then
            rm -f .github/workflows/quality.yml
          fi
          test -z "$(git status --porcelain .github/workflows)"
          rm -rf dist node_modules .source
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize cinematic motion and PDF library"
          git push origin HEAD:main

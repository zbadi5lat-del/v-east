name: Unpack V.East production source

on:
  push:
    branches: [main]
    paths:
      - "source.tgz"
      - ".github/workflows/unpack-source.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack V.East source
        shell: bash
        run: |
          set -euo pipefail
          echo "a06f88073f1004a447bb2c1b61c8456573ae55f2df0fb7dc462caef2227270e0  source.tgz" | sha256sum -c -
          rm -rf /tmp/veast-source
          mkdir -p /tmp/veast-source
          tar -xzf source.tgz -C /tmp/veast-source
          rsync -a --delete             --exclude '.git'             --exclude '.github'             /tmp/veast-source/ ./

      - name: Commit unpacked production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Production source already unpacked."
            exit 0
          fi
          git commit -m "chore: unpack verified V.East production source"
          git push

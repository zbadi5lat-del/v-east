name: V.East exact final package 889f6223

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/final-package-889f6223.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          expected="889f62230fbb1784f205676c5205f3a3c782a474"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          npm install --no-audit --no-fund --package-lock=false
          npm run verify:source
          npm run verify:worldclass
          npm run verify:final-experience
          npm run lint
          VEAST_RELEASE_SHA="$actual" npm run build

      - name: Create exact tracked-source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/veast-final
          git rev-parse HEAD > /tmp/veast-final/GITHUB_COMMIT.txt
          git archive \
            --format=zip \
            --prefix=V_East_Corporate_Website_FINAL_GITHUB_889f6223/ \
            --output=/tmp/veast-final/V_East_FINAL_SEND_TO_FRIEND_GITHUB_889f6223_20260928.zip \
            HEAD
          cd /tmp/veast-final
          sha256sum V_East_FINAL_SEND_TO_FRIEND_GITHUB_889f6223_20260928.zip > V_East_FINAL_SEND_TO_FRIEND_GITHUB_889f6223_20260928_SHA256.txt
          unzip -t V_East_FINAL_SEND_TO_FRIEND_GITHUB_889f6223_20260928.zip

      - name: Upload exact final package
        uses: actions/upload-artifact@v7
        with:
          name: veast-final-exact-889f6223
          path: |
            /tmp/veast-final/GITHUB_COMMIT.txt
            /tmp/veast-final/V_East_FINAL_SEND_TO_FRIEND_GITHUB_889f6223_20260928.zip
            /tmp/veast-final/V_East_FINAL_SEND_TO_FRIEND_GITHUB_889f6223_20260928_SHA256.txt
          compression-level: 0
          if-no-files-found: error

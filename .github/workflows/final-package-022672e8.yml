name: V.East exact final package 022672e8

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/final-package-022672e8.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          expected="022672e877ce891fba73b5986141636aa514cae3"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          npm install --no-audit --no-fund --package-lock=false
          npm run verify:source
          npm run verify:worldclass
          npm run verify:final-experience
          npm run lint
          VEAST_RELEASE_SHA="$actual" npm run build

      - name: Create exact tracked-source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/veast-final
          git rev-parse HEAD > /tmp/veast-final/GITHUB_COMMIT.txt
          git archive             --format=zip             --prefix=V_East_Corporate_Website_FINAL_GITHUB_022672e8/             --output=/tmp/veast-final/V_East_FINAL_SEND_TO_FRIEND_GITHUB_022672e8_20260926.zip             HEAD
          cd /tmp/veast-final
          sha256sum V_East_FINAL_SEND_TO_FRIEND_GITHUB_022672e8_20260926.zip > V_East_FINAL_SEND_TO_FRIEND_GITHUB_022672e8_20260926_SHA256.txt
          unzip -t V_East_FINAL_SEND_TO_FRIEND_GITHUB_022672e8_20260926.zip

      - name: Upload exact final package
        uses: actions/upload-artifact@v7
        with:
          name: veast-final-exact-022672e8
          path: |
            /tmp/veast-final/GITHUB_COMMIT.txt
            /tmp/veast-final/V_East_FINAL_SEND_TO_FRIEND_GITHUB_022672e8_20260926.zip
            /tmp/veast-final/V_East_FINAL_SEND_TO_FRIEND_GITHUB_022672e8_20260926_SHA256.txt
          compression-level: 0
          if-no-files-found: error

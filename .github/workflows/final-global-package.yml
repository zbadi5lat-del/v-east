name: V.East final globally audited package

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/final-global-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify exact commit
        shell: bash
        run: |
          set -euo pipefail
          expected="d2615a6f934dc98888765e987e0342ea88ec0c07"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf '%s\n' "$actual"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Final source and build gates
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:source
          npm run verify:worldclass
          npm run verify:final-experience
          npm run lint
          npm run build

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high

      - name: Create exact tracked-source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/veast-final
          git rev-parse HEAD > /tmp/veast-final/GITHUB_COMMIT.txt
          git archive \
            --format=zip \
            --prefix=V_East_Corporate_Website_FINAL_GLOBAL_AUDITED/ \
            --output=/tmp/veast-final/V_East_FINAL_GLOBAL_AUDITED_GITHUB_d2615a6f_20260925.zip \
            HEAD
          cd /tmp/veast-final
          sha256sum V_East_FINAL_GLOBAL_AUDITED_GITHUB_d2615a6f_20260925.zip > V_East_FINAL_GLOBAL_AUDITED_GITHUB_d2615a6f_20260925_SHA256.txt
          unzip -t V_East_FINAL_GLOBAL_AUDITED_GITHUB_d2615a6f_20260925.zip

      - name: Upload exact final package
        uses: actions/upload-artifact@v4
        with:
          name: veast-final-global-audited
          path: |
            /tmp/veast-final/GITHUB_COMMIT.txt
            /tmp/veast-final/V_East_FINAL_GLOBAL_AUDITED_GITHUB_d2615a6f_20260925.zip
            /tmp/veast-final/V_East_FINAL_GLOBAL_AUDITED_GITHUB_d2615a6f_20260925_SHA256.txt
          compression-level: 0
          if-no-files-found: error

name: V.East final global exact package

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/final-global-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Final verification gates
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:source
          npm run verify:worldclass
          npm run verify:final-experience
          npm run lint
          npm run build
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high

      - name: Verify authoritative commit and create exact archive
        shell: bash
        run: |
          set -euo pipefail
          expected="d0df7bbe14848252a8a45b6ff5c842596a519625"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          mkdir -p /tmp/veast-final
          printf '%s\n' "$actual" > /tmp/veast-final/GITHUB_COMMIT.txt
          git archive \
            --format=zip \
            --prefix=V_East_Corporate_Website_FINAL_GLOBAL_d0df7bbe/ \
            --output=/tmp/veast-final/V_East_FINAL_GLOBAL_GITHUB_d0df7bbe_20260925.zip \
            HEAD
          cd /tmp/veast-final
          sha256sum V_East_FINAL_GLOBAL_GITHUB_d0df7bbe_20260925.zip > V_East_FINAL_GLOBAL_GITHUB_d0df7bbe_20260925_SHA256.txt
          unzip -t V_East_FINAL_GLOBAL_GITHUB_d0df7bbe_20260925.zip

      - name: Upload exact package
        uses: actions/upload-artifact@v4
        with:
          name: veast-final-global-d0df7bbe
          path: |
            /tmp/veast-final/GITHUB_COMMIT.txt
            /tmp/veast-final/V_East_FINAL_GLOBAL_GITHUB_d0df7bbe_20260925.zip
            /tmp/veast-final/V_East_FINAL_GLOBAL_GITHUB_d0df7bbe_20260925_SHA256.txt
          compression-level: 0
          if-no-files-found: error

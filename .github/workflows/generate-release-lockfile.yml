name: Generate V.East release lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/generate-release-lockfile.yml"

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: veast-release-lockfile
          path: package-lock.json
          if-no-files-found: error

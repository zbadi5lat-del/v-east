name: Generate V.East release lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/generate-release-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
      - name: Commit lockfile to verification branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "build: lock production dependency graph"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: veast-release-lockfile
          path: package-lock.json
          if-no-files-found: error

name: Apply cinematic ocean and fixed header

on:
  push:
    branches: [main]
    paths:
      - ".source/final-ocean-header-patch.b64"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bounded payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .source/final-ocean-header-patch.b64 > /tmp/final-ocean-header-patch.tgz
          echo "292689700d655e6420e5af457db061a9e14b9986c033ff60493386c62f6016fc  /tmp/final-ocean-header-patch.tgz" | sha256sum -c -
          python - <<'PY'
          import tarfile
          allowed = {
              'src/App.tsx',
              'src/components/Header.tsx',
              'src/components/SiteEntrance.tsx',
              'src/index.css',
              'scripts/audit-worldclass.mjs',
          }
          with tarfile.open('/tmp/final-ocean-header-patch.tgz', 'r:gz') as tf:
              members = [m for m in tf.getmembers() if m.isfile()]
              actual = {m.name.removeprefix('./') for m in members}
              if actual != allowed:
                  raise SystemExit(f'Unexpected patch paths: {sorted(actual ^ allowed)}')
              for m in members:
                  if m.issym() or m.islnk():
                      raise SystemExit('Links are not allowed')
              tf.extractall('.', filter='data')
          PY

      - name: Verify source gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-source.mjs
          node scripts/audit-worldclass.mjs

      - name: Commit verified changes and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .source/final-ocean-header-patch.b64
          rm -f .github/workflows/apply-cinematic-ocean.yml
          rmdir .source 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: cinematic ocean intro and persistent scroll header"
          git push
